[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-drone-security"
version = "1.0.0"
description = "Adaptive Trust-Aware Drone Security Framework using D2DAP authentication and ML-based intrusion detection (software simulation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kapil" }, { name = "Devesh" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<1.8",
    "xgboost>=2.0,<4",
    "matplotlib>=3.8,<4",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "ecdsa>=0.19,<1",
    "cryptography>=42",
    "psutil>=5.9",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-psutil",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "S",        # bandit security
    "PL",       # pylint subset
    "NPY",      # numpy
    "PT",       # pytest style
]
ignore = [
    # Mathematical notation from the D2DAP paper (A, B, K, P, Y_i ...) is kept on
    # purpose so code can be checked line-by-line against the paper.
    "N802", "N803", "N806",
    "PLR0913",  # protocol/experiment functions legitimately take many parameters
    "PLR2004",  # numeric literals in tests are expected values
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "PLR2004", "S311"]
# Simulation (not security) randomness uses seeded numpy Generators by design.
"scripts/**" = ["T201"]

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["backend/app", "scripts"]
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship without type information.
module = ["ecdsa.*", "sklearn.*", "xgboost.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --timeout=300"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "integration: multi-module integration tests",
    "e2e: end-to-end scenario tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
